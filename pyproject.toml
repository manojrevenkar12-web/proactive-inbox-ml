[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "proactive-inbox-ml"
version = "1.0.0"
description = "ML for an agent-first messaging app: action classification with out-of-scope detection, hybrid retrieval with a learned reranker, privacy-preserving personalisation, evaluation gates and an ONNX inference service."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Manoj Kumar Prakash" }]
# Serving needs only these: no PyTorch in the inference image.
dependencies = [
  "numpy>=1.26",
  "onnxruntime>=1.18",
  "rank-bm25>=0.2.2",
  "lightgbm>=4.7",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "prometheus-client>=0.20",
  "pydantic>=2.8",
]

[project.optional-dependencies]
train = ["torch>=2.3", "onnx>=1.16", "onnxscript>=0.1", "scikit-learn>=1.5"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
inbox = "inbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: trains real models (minutes on CPU)"]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
